<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Verse IQ — Settings</title>
  <style>
    @font-face {
      font-family: "VIQ Space Grotesk";
      src: url("fonts/space-grotesk-latin.woff2") format("woff2");
      font-weight: 300 700;
    }
    body { font-family: "VIQ Space Grotesk", "Space Grotesk", -apple-system, sans-serif; background: #EFEFE7; color: #0F0F0F; max-width: 520px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 18px; letter-spacing: 0.02em; }
    h1 span { background: #FFFF64; padding: 2px 8px; border: 2px solid #0F0F0F; }
    p { color: #3D3D3D; font-size: 13px; line-height: 1.5; }
    input { width: 100%; box-sizing: border-box; background: #fff; color: #0F0F0F; border: 2px solid #0F0F0F; border-radius: 0; padding: 10px 12px; font-size: 13px; font-family: inherit; }
    button { margin-top: 14px; background: #FFFF64; color: #0F0F0F; font-weight: 700; border: 2px solid #0F0F0F; box-shadow: 3px 3px 0 #0F0F0F; border-radius: 0; padding: 10px 18px; font-size: 13px; cursor: pointer; font-family: inherit; }
    button:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 #0F0F0F; }
    #status { font-size: 12px; margin-top: 10px; color: #0F0F0F; font-weight: 600; min-height: 16px; }
    a { color: #0F0F0F; }
    a:hover { background: #FFFF64; }
  </style>
</head>
<body>
  <h1><span>SONG TRIVIA</span> — Settings</h1>
  <p>
    Paste a Genius API <strong>client access token</strong> (from
    <a href="https://genius.com/api-clients" target="_blank">genius.com/api-clients</a>).
    It is stored in your browser's extension storage and only sent to
    <code>api.genius.com</code>.
  </p>
  <input type="password" id="token" placeholder="Genius access token" autocomplete="off" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
